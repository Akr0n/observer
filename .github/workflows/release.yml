# Publishes a release when a "v*" tag is pushed.
#
# A file SEPARATE from build.yml, and it must stay that way. The two contexts the main-protection
# ruleset requires are the exact strings "build (ubuntu-latest)" and "build (windows-latest)":
# this workflow does not run on pull requests, so it adds no contexts and cannot leave any PR
# waiting forever.
name: release

on:
  push:
    tags:
      - 'v*'

# contents: to create the release. id-token and attestations: for the provenance
# attestation, which is signed with the workflow's short-lived OIDC token and not with a
# repository secret - there is no key to guard, and none to lose.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the MSI
        run: ./packaging/windows/pack.ps1
        shell: pwsh

      # THE guard that makes a release trustworthy. The tag and the version inside the package
      # are two values set independently: if they diverge, whoever downloads "v0.2.0" installs
      # a program that claims to be something else, and nobody notices until it really
      # matters - that is, at the worst possible moment.
      - name: The MSI version matches the tag
        shell: pwsh
        run: |
          $expected = "${{ github.ref_name }}" -replace '^v', ''
          $msi = Get-ChildItem packaging/windows/bin/Release/Observer.msi
          $inst = New-Object -ComObject WindowsInstaller.Installer
          $db = $inst.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$inst,@($msi.FullName,0))
          $v = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@("SELECT Value FROM Property WHERE Property='ProductVersion'"))
          $v.GetType().InvokeMember('Execute','InvokeMethod',$null,$v,$null)
          $r = $v.GetType().InvokeMember('Fetch','InvokeMethod',$null,$v,$null)
          $found = $r.GetType().InvokeMember('StringData','GetProperty',$null,$r,@(1))
          if ($found -ne $expected) {
            Write-Error "The tag says $expected but the MSI says $found. Set <Version> in Directory.Build.props to match the tag."
            exit 1
          }
          Write-Host "MSI: version $found, matching the tag."

      # The provenance attestation. It is NOT an Authenticode signature and Windows does not
      # look at it: it answers the question "does this file really come from that source
      # code", not "does Windows trust whoever made it". It is the only one of the two
      # available today, and it costs nothing on a public repository.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: packaging/windows/bin/Release/Observer.msi

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: packaging/windows/bin/Release/Observer.msi
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the .deb
        run: ./packaging/linux/pack.sh

      - name: The .deb version matches the tag
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_REF_NAME#v}"
          PACKAGE=$(ls packaging/linux/out/observer_*.deb)
          FOUND=$(dpkg-deb --field "$PACKAGE" Version)
          if [ "$FOUND" != "$EXPECTED" ]; then
            echo "The tag says $EXPECTED but the package says $FOUND." >&2
            exit 1
          fi
          echo "deb: version $FOUND, matching the tag."

      # The same two guards as the build workflow. A release is where a mistake costs the
      # most: whatever ends up here is downloaded by people who will never rebuild it.
      - name: No secrets inside the package
        run: |
          set -euo pipefail
          PACKAGE=$(ls packaging/linux/out/observer_*.deb)
          if dpkg-deb --contents "$PACKAGE" | grep -E 'appsettings.*Local\.json|credentials\.json|client\.json|\.pdb$'; then
            echo "The package contains a file that can carry a secret." >&2
            exit 1
          fi
          echo "No secrets in the package."

      - name: Check with lintian
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --tag-display-limit 0 --fail-on error,warning packaging/linux/out/observer_*.deb

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: packaging/linux/out/observer_*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packaging/linux/out/observer_*.deb
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      # BEFORE the download, and the order is not decoration: checkout cleans the workspace, so
      # doing it after would delete packages/ - the MSI and the .deb - and the release would be
      # created with nothing attached. It is here for one file, the release's own notes section.
      - uses: actions/checkout@v7
        with:
          # Nothing in this job pushes: gh uses GH_TOKEN below. Without this the checkout would leave
          # the workflow's token (contents: write) on the runner's disk for the whole job, in a step
          # that also reads a path controlled by the repository.
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # A release can carry a section of its own - a security fix, an upgrade warning, anything
          # a user has to read BEFORE the signing caveats below. It is the file
          # .github/release-notes/<version>.md in the tagged commit; a release without one gets the
          # template alone, exactly as before. It is a file and not the changelog because the
          # changelog ships only inside the .deb: a Windows user who downloads the MSI would never
          # see it, and a security fix that only Linux users can read is not announced to the
          # people it affects. It is copied, never expanded, so backticks and dollar signs in it are
          # safe - which the heredoc below is not.
          #
          # The file goes in the RELEASE PR, before the tag: this reads the tagged commit, so one
          # added afterwards is ignored. For a release that already exists the GitHub page is the
          # truth, edited with gh release edit, and the file is only a record of what it said.
          # Nothing makes the file mandatory, so the step SAYS in the log whether it found one:
          # that line is what tells a misspelt name (v0.25.0.md for 0.25.0.md) from a release that
          # simply has no section.
          SECTION=".github/release-notes/${VERSION}.md"

          # Refused, not ignored. cat would follow a symlink out of the folder and publish whatever
          # it points to, and a directory would fall through to the template, which reads as "no
          # section" when somebody meant to write one.
          if [ -L "$SECTION" ] || { [ -e "$SECTION" ] && [ ! -f "$SECTION" ]; }; then
            echo "$SECTION exists but is not a regular file." >&2
            exit 1
          fi

          {
            echo "Observer $VERSION."
            echo
            if [ -f "$SECTION" ]; then
              echo "Release notes: section from $SECTION" >&2
              # Two things an editor can leave behind. A UTF-8 byte order mark would land in the
              # MIDDLE of the notes and stop the first heading being a heading; a file with no final
              # newline would run into the template's first heading, and if it ended in an HTML
              # block would swallow it.
              sed -e '1s/^\xEF\xBB\xBF//' -e '$a\' "$SECTION"
              echo
            else
              echo "Release notes: no $SECTION, template only. In .github/release-notes:" >&2
              ls .github/release-notes >&2 2>/dev/null || echo "  (the folder does not exist)" >&2
            fi
          } > note.md

          # The notes say first what the user will run into first. The packages are not
          # signed: hiding it would turn an expected warning into a reason for suspicion.
          cat >> note.md <<NOTE
          ## The packages are NOT signed

          Windows will say so twice, in two different ways, and the two are not fixed
          by the same thing:

          - User Account Control will show **"Unknown publisher"**. A signature removes
            this immediately, from the first download;
          - **SmartScreen** will warn on first run of the installer. A signature does
            NOT remove this: since March 2024 not even an EV certificate bypasses it.
            It depends on how many clean downloads the file has accumulated, not on the
            certificate it carries.

          To go ahead: *More info*, then *Run anyway*.

          ## Where this package comes from

          Every attached file carries a provenance attestation signed by GitHub, which
          ties it to the commit and the workflow that produced it:

          \`\`\`
          gh attestation verify Observer.msi --repo $GITHUB_REPOSITORY
          \`\`\`

          It is not an Authenticode signature and Windows does not look at it. It answers
          a different and equally useful question: *does this file really come from that
          source code*, rather than *does Windows trust whoever made it*.

          ## Windows

          Installs the service, the dashboard and the command line. Needs an elevated terminal:

          \`\`\`
          msiexec /i Observer.msi
          \`\`\`

          Nothing else needs installing: the package **bundles the .NET runtime**, which is
          why it weighs about fifty megabytes. Up to 0.2.0 it required ASP.NET Core 10
          without checking that it was there, and on a machine without it the service
          died at startup while the installer talked about insufficient privileges - a
          cause that had nothing to do with the real one.

          Note that this means the runtime's security fixes **no longer** come from
          Windows Update. They come with a new Observer release.

          If that machine already has an Observer service registered by hand, remove it
          first, and empty the installation folder.

          ## Linux

          \`\`\`
          sudo apt install ./observer_${VERSION}_amd64.deb
          \`\`\`

          Requires Ubuntu 24.04 or later: \`aspnetcore-runtime-10.0\` comes from the official
          archive, so the runtime is not bundled and is updated with the system.

          ## After installing

          To watch the machine you are sitting at there is nothing to configure, and no token
          is needed: the dashboard uses the local channel. The token and the certificate
          fingerprint are needed only so that ANOTHER computer can query this one, and you get
          them with \`observer share\`.
          NOTE

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Observer $VERSION" \
            --notes-file note.md \
            packages/msi/Observer.msi \
            packages/deb/observer_*.deb
