name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  # An ADDITIONAL job, and it must stay that way. The two contexts the main-protection ruleset
  # requires are the exact strings "build (ubuntu-latest)" and "build (windows-latest)": adding a
  # new job is safe, renaming "build" or the values of the "os" matrix is not. And the matrix does
  # NOT get a second dimension: that would change the names of the required contexts, and that is
  # the one change that blocks every PR forever.
  #
  # It is separate for a second reason too: the WiX project is not in Observer.slnx, because
  # WixToolset.Sdk ships native binaries for Windows only and ICE validation always runs. Inside
  # the solution it would make "build (ubuntu-latest)" fail forever.
  pack-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the package
        run: ./packaging/windows/pack.ps1
        shell: pwsh

      - name: No secrets inside the package
        # The .wixproj already has a guard on the PAYLOAD, but this one checks the FINISHED
        # PACKAGE, which is what ends up on GitHub Releases. pack-linux already has the same
        # defence: without it, the MSI would be the only one of the two nobody checks once built.
        shell: pwsh
        run: |
          $msi = Get-ChildItem packaging/windows/bin/Release/Observer.msi
          $inst = New-Object -ComObject WindowsInstaller.Installer
          $db = $inst.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$inst,@($msi.FullName,0))
          $v = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@('SELECT FileName FROM File'))
          $v.GetType().InvokeMember('Execute','InvokeMethod',$null,$v,$null)
          $suspects = @()
          $n = 0
          while ($true) {
            $r = $v.GetType().InvokeMember('Fetch','InvokeMethod',$null,$v,$null)
            if (-not $r) { break }
            $n++
            $name = $r.GetType().InvokeMember('StringData','GetProperty',$null,$r,@(1))
            if ($name -match 'Local\.json|credential|client\.json|\.pdb') { $suspects += $name }
          }
          if ($suspects) {
            Write-Error "The package contains: $($suspects -join ', ')"
            exit 1
          }
          Write-Host "No secrets among the $n packaged files."

      - name: The service restarts if it dies
        # The recovery actions come from a custom action of the util extension: "it
        # compiled" does not mean the row made it into the package. Without this step the
        # configuration would have been checked once, by hand, on the day it was
        # written. The table name is "Wix4..." even with WiX 6, like "Wix5..." for the
        # firewall: extension tables keep the version number they were introduced with.
        shell: pwsh
        run: |
          $msi = Get-ChildItem packaging/windows/bin/Release/Observer.msi
          $inst = New-Object -ComObject WindowsInstaller.Installer
          $db = $inst.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$inst,@($msi.FullName,0))
          $sql = 'SELECT `ServiceName`,`FirstFailureActionType`,`SecondFailureActionType`,' +
                 '`ThirdFailureActionType`,`RestartServiceDelayInSeconds` FROM `Wix4ServiceConfig`'
          $v = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@($sql))
          $v.GetType().InvokeMember('Execute','InvokeMethod',$null,$v,$null)
          $rows = @()
          while ($true) {
            $r = $v.GetType().InvokeMember('Fetch','InvokeMethod',$null,$v,$null)
            if (-not $r) { break }
            $fields = @()
            for ($i = 1; $i -le 5; $i++) {
              $fields += [string]$r.GetType().InvokeMember('StringData','GetProperty',$null,$r,@($i))
            }
            $rows += ,$fields
          }
          $observer = $rows | Where-Object { $_[0] -eq 'Observer' }
          if (-not $observer) {
            Write-Error "The MSI does not configure the service's recovery actions: if it dies, it stays down."
            exit 1
          }
          if ($observer[1] -ne 'restart' -or $observer[2] -ne 'restart' -or $observer[3] -ne 'restart') {
            Write-Error "Unexpected recovery actions: $($observer[1])/$($observer[2])/$($observer[3])"
            exit 1
          }
          Write-Host "Recovery: $($observer[1])/$($observer[2])/$($observer[3]), delay $($observer[4]) s."

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: Observer-msi
          path: packaging/windows/bin/Release/Observer.msi
          if-no-files-found: error

  # This is an ADDITIONAL job too, and the same rule applies. The matrix of the "build" job stays
  # one-dimensional, and the two contexts the ruleset requires keep their names.
  pack-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the package
        run: ./packaging/linux/pack.sh

      - name: No secrets inside the package
        # The script already has this guard, but this step repeats it on the FINISHED PACKAGE,
        # not on the tree it was built from. A .deb that shipped appsettings.Local.json would
        # give EVERY machine the same token, because explicit configuration wins over the
        # credential store: on its own it would defeat the mechanism that generates one key per machine.
        run: |
          set -euo pipefail
          PACKAGE=$(ls packaging/linux/out/observer_*.deb)
          if dpkg-deb --contents "$PACKAGE" | grep -E 'appsettings.*Local\.json|credentials\.json|client\.json|\.pdb$'; then
            echo "The package contains a file that can carry a secret." >&2
            exit 1
          fi
          echo "No secrets in the package."
          dpkg-deb --contents "$PACKAGE" | wc -l

      - name: Check with lintian
        # lintian does not run on Windows, and this is the only Debian machine the project
        # touches: until this step existed, every packaging fix stayed an untested
        # hypothesis. Now the package is inspected where it is built.
        #
        # The threshold includes WARNINGS, not only errors. It was raised when the package
        # reached zero tags: keeping a clean package clean costs far less than cleaning it
        # up, and one warning let through becomes the first of a list that nobody reads
        # any more. If a lintian update introduces a new tag, this job turns red with
        # nothing changed here: that is intended, and it is a signal, not a false alarm. It
        # still does not block the merge, because pack-linux is not a required check of the
        # ruleset.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          PACKAGE=$(ls packaging/linux/out/observer_*.deb)
          lintian --version
          lintian --tag-display-limit 0 --fail-on error,warning "$PACKAGE"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: Observer-deb
          path: packaging/linux/out/observer_*.deb
          if-no-files-found: error
