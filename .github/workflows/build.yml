name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  # Job AGGIUNTIVO, e va tenuto tale. I due contesti richiesti dal ruleset main-protection sono
  # le stringhe esatte "build (ubuntu-latest)" e "build (windows-latest)": aggiungere un job
  # nuovo e' sicuro, rinominare "build" o i valori della matrice "os" no. E NON si aggiunge una
  # seconda dimensione alla matrice: quella cambierebbe i nomi dei contesti richiesti, ed e' la
  # mossa che blocca ogni PR per sempre.
  #
  # Sta a parte anche per una seconda ragione: il progetto WiX non e' in Observer.slnx, perche'
  # WixToolset.Sdk porta binari nativi solo per Windows e la validazione ICE gira sempre. Dentro
  # la soluzione farebbe fallire "build (ubuntu-latest)" per sempre.
  pack-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Costruisci il pacchetto
        run: ./packaging/windows/pack.ps1
        shell: pwsh

      - name: Nessun segreto dentro il pacchetto
        # Il .wixproj ha gia' una guardia sul PAYLOAD, ma questa guarda il PACCHETTO FINITO,
        # che e' la cosa che finisce su GitHub Releases. E' la stessa difesa che pack-linux ha
        # gia': senza, l'MSI sarebbe l'unico dei due che nessuno ricontrolla dopo averlo fatto.
        shell: pwsh
        run: |
          $msi = Get-ChildItem packaging/windows/bin/Release/Observer.msi
          $inst = New-Object -ComObject WindowsInstaller.Installer
          $db = $inst.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$inst,@($msi.FullName,0))
          $v = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@('SELECT FileName FROM File'))
          $v.GetType().InvokeMember('Execute','InvokeMethod',$null,$v,$null)
          $sospetti = @()
          $n = 0
          while ($true) {
            $r = $v.GetType().InvokeMember('Fetch','InvokeMethod',$null,$v,$null)
            if (-not $r) { break }
            $n++
            $nome = $r.GetType().InvokeMember('StringData','GetProperty',$null,$r,@(1))
            if ($nome -match 'Local\.json|credential|client\.json|\.pdb') { $sospetti += $nome }
          }
          if ($sospetti) {
            Write-Error "Il pacchetto contiene: $($sospetti -join ', ')"
            exit 1
          }
          Write-Host "Nessun segreto fra i $n file impacchettati."

      - name: Pubblica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Observer-msi
          path: packaging/windows/bin/Release/Observer.msi
          if-no-files-found: error

  # Anche questo e' un job AGGIUNTIVO: vale la stessa regola. La matrice del job "build" resta
  # a una sola dimensione, e i due contesti richiesti dal ruleset non cambiano nome.
  pack-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Costruisci il pacchetto
        run: ./packaging/linux/pack.sh

      - name: Nessun segreto dentro il pacchetto
        # La guardia c'e' gia' dentro lo script, ma questa la ripete sul PACCHETTO FINITO e non
        # sull'albero da cui e' stato costruito. Un .deb che imbarcasse appsettings.Local.json
        # darebbe a OGNI macchina lo stesso token, perche' la configurazione esplicita vince sul
        # deposito: annullerebbe da sola il meccanismo che genera una chiave per macchina.
        run: |
          set -euo pipefail
          PACCHETTO=$(ls packaging/linux/out/observer_*.deb)
          if dpkg-deb --contents "$PACCHETTO" | grep -E 'appsettings.*Local\.json|credentials\.json|client\.json|\.pdb$'; then
            echo "Il pacchetto contiene un file che puo' portare un segreto." >&2
            exit 1
          fi
          echo "Nessun segreto nel pacchetto."
          dpkg-deb --contents "$PACCHETTO" | wc -l

      - name: Verifica con lintian
        # lintian non gira su Windows, e questa e' l'unica macchina Debian che il progetto
        # tocca: finche' questo passo non e' esistito, ogni correzione di packaging e' rimasta
        # un'ipotesi non verificata. Adesso il pacchetto viene ispezionato dove e' costruito.
        #
        # --fail-on error stampa TUTTI i tag e si ferma solo sugli errori. Gli avvertimenti
        # restano a vista di proposito: un pacchetto che ne accumula in silenzio e' un
        # pacchetto che nessuno guarda piu'.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          PACCHETTO=$(ls packaging/linux/out/observer_*.deb)
          lintian --version
          lintian --tag-display-limit 0 --fail-on error "$PACCHETTO"

      - name: Pubblica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Observer-deb
          path: packaging/linux/out/observer_*.deb
          if-no-files-found: error
